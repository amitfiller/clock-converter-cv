<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }
      body {
        display: grid;
        place-items: center;
      }
      #clock {
        font-family: "Courier New", monospace;
        font-size: 68px;
        color: #00ff41;
        letter-spacing: 2px;
        user-select: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="clock">00:00:00</div>
    <script>
      const _p = new URLSearchParams(window.location.search);
      const H = parseInt(_p.get('h') || 0);
      const M = parseInt(_p.get('m') || 0);
      const S = parseInt(_p.get('s') || 0);
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById('clock').textContent = pad(H) + ':' + pad(M) + ':' + pad(S);
    </script>
  </body>
</html>
