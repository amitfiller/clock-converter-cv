<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fce4ec;display:flex;align-items:center;justify-content:center;height:100vh;}
.clock{position:relative;width:300px;height:300px;}
.outer{position:absolute;width:300px;height:300px;border-radius:50%;
  background:#f48fb1;box-shadow:0 6px 25px rgba(172,26,87,0.3);}
.face{position:absolute;width:250px;height:250px;border-radius:50%;
  background:#fff9fb;border:2px solid #f8bbd9;top:50%;left:50%;transform:translate(-50%,-50%);}
#hour,#minute,#second{position:absolute;bottom:50%;left:50%;
  transform-origin:bottom center;border-radius:4px;z-index:5;}
#hour  {width:9px; height:54px; background:#ad1457;margin-left:-4.5px;border-radius:5px;}
#minute{width:6px; height:78px; background:#e91e63;margin-left:-3px;border-radius:4px;}
#second{width:2px; height:88px;background:#ff80ab;margin-left:-1px;}
.dot{position:absolute;width:14px;height:14px;background:#ad1457;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;}
</style></head><body>
<div class="clock">
  <div class="outer"></div>
  <div class="face"><span style="position:absolute;left:173px;top:41.9px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">1</span><span style="position:absolute;left:208.1px;top:77px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">2</span><span style="position:absolute;left:221px;top:125px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">3</span><span style="position:absolute;left:208.1px;top:173px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">4</span><span style="position:absolute;left:173px;top:208.1px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">5</span><span style="position:absolute;left:125px;top:221px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">6</span><span style="position:absolute;left:77px;top:208.1px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">7</span><span style="position:absolute;left:41.9px;top:173px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">8</span><span style="position:absolute;left:29px;top:125px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">9</span><span style="position:absolute;left:41.9px;top:77px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">10</span><span style="position:absolute;left:77px;top:41.9px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">11</span><span style="position:absolute;left:125px;top:29px;transform:translate(-50%,-50%);font:bold 14px "Courier New",monospace;color:#ad1457;">12</span></div>
  <div id="hour"></div><div id="minute"></div><div id="second"></div>
  <div class="dot"></div>
</div>
<script>
const _p = new URLSearchParams(window.location.search);
const H = parseInt(_p.get('h') || 0);
const M = parseInt(_p.get('m') || 0);
const S = parseInt(_p.get('s') || 0);
var hour   = 360*(H/12);
var minute = 360*(M/60);
var second = 360*(S/60);
document.getElementById("hour").style.transform   = 'rotate(' + hour   + 'deg)';
document.getElementById("minute").style.transform = 'rotate(' + minute + 'deg)';
document.getElementById("second").style.transform = 'rotate(' + second + 'deg)';
</script>
</body></html>
