<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;height:100vh;}
.clock{position:relative;width:300px;height:300px;}
.face{position:absolute;width:300px;height:300px;border-radius:50%;
  background:#16213e;border:4px solid #e94560;
  box-shadow:0 0 40px rgba(233,69,96,0.2);}
#hour,#minute,#second{position:absolute;bottom:50%;left:50%;
  transform-origin:bottom center;border-radius:3px;z-index:5;}
#hour  {width:8px; height:68px; background:#ffffff;margin-left:-4px;}
#minute{width:5px; height:98px; background:#dddddd;margin-left:-2.5px;}
#second{width:2px; height:110px;background:#e94560;margin-left:-1px;}
.dot{position:absolute;width:12px;height:12px;background:#e94560;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;}
</style></head><body>
<div class="clock">
  <div class="face"><span style="position:absolute;left:203.0px;top:58.2px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">1</span><span style="position:absolute;left:241.8px;top:97.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">2</span><span style="position:absolute;left:256.0px;top:150.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">3</span><span style="position:absolute;left:241.8px;top:203.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">4</span><span style="position:absolute;left:203.0px;top:241.8px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">5</span><span style="position:absolute;left:150.0px;top:256.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">6</span><span style="position:absolute;left:97.0px;top:241.8px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">7</span><span style="position:absolute;left:58.2px;top:203.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">8</span><span style="position:absolute;left:44.0px;top:150.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">9</span><span style="position:absolute;left:58.2px;top:97.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">10</span><span style="position:absolute;left:97.0px;top:58.2px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">11</span><span style="position:absolute;left:150.0px;top:44.0px;transform:translate(-50%,-50%);font:bold 14px Arial;color:#fff;">12</span></div>
  <div id="hour"></div><div id="minute"></div><div id="second"></div>
  <div class="dot"></div>
</div>
<script>
const _p = new URLSearchParams(window.location.search);
const H = parseInt(_p.get('h') || 0);
const M = parseInt(_p.get('m') || 0);
const S = parseInt(_p.get('s') || 0);
var hour   = 360*(H/12);
var minute = 360*(M/60);
var second = 360*(S/60);
document.getElementById("hour").style.transform   = 'rotate(' + hour   + 'deg)';
document.getElementById("minute").style.transform = 'rotate(' + minute + 'deg)';
document.getElementById("second").style.transform = 'rotate(' + second + 'deg)';
</script>
</body></html>
